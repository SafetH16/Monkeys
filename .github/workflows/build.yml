name: Build

on:
  push:
    branches: [main]
  pull_request:

# Read-only token: this workflow only compiles the app; it never publishes
# releases, never signs, and needs no secrets.
permissions:
  contents: read

jobs:
  build:
    name: Compile MonKeys (arm64, Swift 6)
    # macos-15: default Xcode 16.x → Swift 6 toolchain (macos-14 ships
    # Xcode 15 / Swift 5.10 and rejects `-swift-version 6`).
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Toolchain info
        run: swiftc --version

      - name: Build
        run: ./build.sh

      - name: Verify bundle structure
        run: |
          test -x "build/MonKeys.app/Contents/MacOS/MonKeys"
          test -f "build/MonKeys.app/Contents/Info.plist"
          echo "Bundle OK"
